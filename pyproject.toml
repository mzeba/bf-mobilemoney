[project]
name = "bf-mobilemoney"
version = "0.0.1"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
description = "Library for mobile money payment in Burkina Faso"
authors = [
    { name = "Mohamed ZEBA", email = "parice02@hotmail.com" },
    { name = "Abdoul Kader KABORÉ", email = "derokabore@hotmail.com" },
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.33.0"]
keywords = [
    "orange money",
    "ligdicash",
    "burkina mobile money",
    "mobile money",
    "moov money",
]

[project.urls]
Homepage = "https://github.com/mzeba/bf-mobilemoney"
Issues = "https://github.com/mzeba/bf-mobilemoney/issues"
Repository = "https://github.com/mzeba/bf-mobilemoney.git"

[tool.setuptools]
packages = ["mobilemoney"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
