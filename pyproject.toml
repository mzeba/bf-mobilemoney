[project]
name = "bf-mobilemoney"
version = "0.0.1"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
description = "Library for mobile money payment in Burkina Faso"
authors = [
    { name = "Mohamed ZEBA", email = "parice02@hotmail.com" },
    { name = "Abdoul Kader KABORÉ", email = "derokabore@hotmail.com" },
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.31.0"]
keywords = [
    "orange money",
    "ligdiash",
    "burkina mobile money",
    "mobile money",
    "moov money",
]

[project.urls]
Homepage = "https://github.com/parice02/bf-mobilemoney"
Issues = "https://github.com/parice02/bf-mobilemoney/issues"
Repository = "https://github.com/parice02/bf-mobilemoney.git"

[tool.setuptools]
packages = ["mobilemoney"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
